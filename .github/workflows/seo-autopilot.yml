name: SEO Autopilot
on:
  workflow_dispatch:
  schedule:
    # Monthly, first day at 06:23 UTC. Recovery uses this calendar boundary too.
    - cron: '23 6 1 * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: seo-autopilot-${{ github.repository }}
  cancel-in-progress: false
jobs:
  permission-proof:
    # Branch acceptance runs only a real read of the existing publishing switch.
    # It cannot collect client data, call a model, change code or deploy.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify current switch access with the hosted identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/seo-autopilot.yml',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request,timeout=20) as response:
                  value=json.load(response)
              assert value.get('path')=='.github/workflows/seo-autopilot.yml' and value.get('state')=='active'
              print(json.dumps({'workflow_read':True,'publishing_switch':'active'}))
          except urllib.error.HTTPError as error:
              print(json.dumps({'workflow_read':False,'http_status':error.code}))
              raise SystemExit(1)
          PY
  content:
    if: github.ref == 'refs/heads/main'
    # Workflow enabled/disabled state is the live publishing control.
    # The variable is an additional startup brake; use scripts/seo/control.py.
    env:
      TRC_SEO_ACTIVE: ${{ vars.TRC_SEO_ACTIVE }}
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A queued or manually retried job must inspect the current main policy/claim.
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install read-only Google client
        run: pip install google-auth==2.40.3 requests==2.32.4 Pillow==11.3.0
      - name: Content safety tests
        run: python -m unittest discover -s scripts/seo -p 'test_*.py' -v
      - name: Claim this client monthly cycle
        id: claim
        run: python scripts/seo/cloud_writer.py claim
      - name: Persist the claim before any model call
        if: steps.claim.outputs.run_mode == 'new'
        run: |
          git config user.name 'TRC SEO Autopilot'
          git config user.email 'seo-autopilot@thereadyconsult.com'
          git add seo/runner.json
          git commit -m 'chore(seo): claim monthly client cycle before generation'
          python scripts/seo/cloud_writer.py publication-gate
          git push origin HEAD:main
      - name: Collect real demand and write checked improvements
        if: steps.claim.outputs.run_mode == 'new' || steps.claim.outputs.run_mode == 'resume'
        id: write
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEO_RUN_MODE: ${{ steps.claim.outputs.run_mode }}
        run: python scripts/seo/cloud_writer.py prepare
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.write.outputs.needs_verify == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Build the exact static release
        if: steps.write.outputs.needs_verify == 'true'
        run: |
          npm ci --no-audit --no-fund
          node --test scripts/test-lead-intake.mjs
          npm run build
          test -s out/index.html
          git diff --check
      - name: Commit checked content only
        if: steps.write.outputs.changed == 'true'
        run: |
          git config user.name 'TRC SEO Autopilot'
          git config user.email 'seo-autopilot@thereadyconsult.com'
          python - <<'PY'
          import json, subprocess
          result=json.load(open('seo-evidence/result.json'))
          subprocess.run(['git','add','--',result['candidate']['path'],'seo/pending.json'],check=True)
          if result['candidate'].get('kind')=='article':
              policy=json.load(open('seo/policy.json'))
              subprocess.run(['git','add','--','ASSETS.md','public/'+policy['article_media']['path'].lstrip('/')],check=True)
          subprocess.run(['git','commit','-m','content(seo): improve evidence-backed article snippet'],check=True)
          subprocess.run(['python','scripts/seo/cloud_writer.py','publication-gate'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
      - name: Deploy direct-upload sites
        if: steps.write.outputs.needs_verify == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3d58f3cfc04230bea51d63f77576d5f3
        run: |
          python - <<'PY'
          import json, os, subprocess
          policy=json.load(open('seo/policy.json'))
          if policy['deploy_method']=='wrangler':
              if not os.environ.get('CLOUDFLARE_API_TOKEN'):
                  raise SystemExit('Persistent Cloudflare publishing credential missing. Checked content remains pending, not shipped.')
              subprocess.run(['python','scripts/seo/cloud_writer.py','publication-gate'],check=True)
              subprocess.run(['npx','--yes','wrangler@4.105.0','pages','deploy','out','--project-name',policy['pages_project'],'--branch','main','--commit-dirty=true'],check=True)
          PY
      - name: Verify the actual served page
        if: steps.write.outputs.needs_verify == 'true'
        run: python scripts/seo/cloud_writer.py verify
      - name: Record successful publication and measurement dates
        if: steps.write.outputs.needs_verify == 'true'
        run: |
          git config user.name 'TRC SEO Autopilot'
          git config user.email 'seo-autopilot@thereadyconsult.com'
          git add seo/state.json
          git commit -m 'chore(seo): record independently verified release and review dates'
          python scripts/seo/cloud_writer.py publication-gate
          git push origin HEAD:main
      - name: Save current research and decisions
        if: steps.write.outputs.research_changed == 'true'
        run: |
          git config user.name 'TRC SEO Autopilot'
          git config user.email 'seo-autopilot@thereadyconsult.com'
          git add seo/research.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(seo): record current sources and demand-based content decision'
            python scripts/seo/cloud_writer.py publication-gate
            git push origin HEAD:main
          fi
      - name: Save due experiment measurements
        if: steps.write.outputs.state_changed == 'true' && steps.write.outputs.needs_verify != 'true'
        run: |
          git config user.name 'TRC SEO Autopilot'
          git config user.email 'seo-autopilot@thereadyconsult.com'
          git add seo/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'measure(seo): compare due experiments with actual completed search data'
            python scripts/seo/cloud_writer.py publication-gate
            git push origin HEAD:main
          fi
      - name: Save public authority research and link-watch state
        if: steps.write.outputs.authority_changed == 'true'
        run: |
          git config user.name 'TRC SEO Autopilot'
          git config user.email 'seo-autopilot@thereadyconsult.com'
          git add seo/authority.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(seo): record public mention research and verified link watch'
            python scripts/seo/cloud_writer.py publication-gate
            git push origin HEAD:main
          fi
      - name: Complete this monthly cycle only after required publication proof
        if: steps.claim.outputs.run_mode == 'new' || steps.claim.outputs.run_mode == 'resume'
        run: |
          python scripts/seo/cloud_writer.py finish
          git config user.name 'TRC SEO Autopilot'
          git config user.email 'seo-autopilot@thereadyconsult.com'
          git add seo/runner.json
          git commit -m 'chore(seo): record completed monthly client cycle'
          python scripts/seo/cloud_writer.py publication-gate
          git push origin HEAD:main
      - name: Prepare readable execution summary
        if: always()
        env:
          SEO_JOB_STATUS: ${{ job.status }}
        run: python scripts/seo/cloud_writer.py summary
      - name: Save private execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seo-execution-${{ github.run_id }}
          path: seo-evidence/
          retention-days: 60
          # A retry of the same run ID resumes before replacing its artifact.
          overwrite: true
          if-no-files-found: warn
      - name: Publish safe operational receipt
        if: always()
        env:
          SEO_STATUS_KEY: ${{ secrets.SEO_STATUS_KEY }}
          SEO_JOB_STATUS: ${{ job.status }}
        run: python scripts/seo/cloud_writer.py report
